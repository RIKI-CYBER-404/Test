name: Build UnityAndroidIDE APK

on:
  push:
    paths:
      - 'upload.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract project ZIP
        run: |
          test -f upload.zip
          mkdir -p project
          unzip -oq upload.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace -p project :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityAndroidIDE-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-reports
          path: |
            project/**/build/reports/
            project/**/build/outputs/logs/
          if-no-files-found: ignore
